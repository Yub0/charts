name: Lint and Test Charts

on:
  pull_request:
  workflow_dispatch:

jobs:
  lint-test:
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || 'self-hosted' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@v4.2.0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
          check-latest: true

      - name: Set up chart-testing
        uses: helm/chart-testing-action@v2.6.1

      - name: Run chart-testing (list-changed)
        id: list-changed
        run: |
          target_branch="${{ github.event.repository.default_branch }}"
          if [ -z "$target_branch" ]; then
            target_branch="main"
          fi
          # Fetch the target branch to ensure it exists locally for ct
          git fetch origin "$target_branch:$target_branch" || true

          changed=$(ct list-changed --target-branch "$target_branch" || echo "")
          if [[ -n "$changed" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run chart-testing (lint)
        if: steps.list-changed.outputs.changed == 'true'
        run: |
          target_branch="${{ github.event.repository.default_branch }}"
          if [ -z "$target_branch" ]; then target_branch="main"; fi
          ct lint --target-branch "$target_branch"

      - name: Create kind cluster
        if: steps.list-changed.outputs.changed == 'true'
        uses: helm/kind-action@v1.10.0

      - name: Run chart-testing (install)
        if: steps.list-changed.outputs.changed == 'true'
        run: |
          target_branch="${{ github.event.repository.default_branch }}"
          if [ -z "$target_branch" ]; then target_branch="main"; fi
          ct install --target-branch "$target_branch"
